<meta charset="utf-8">
<title>M3 / M4 / M5 Macs on OLX &#8212; 24 GB and up</title>
<style>
  :root {
    --ground:#F2F4F4; --surface:#FFFFFF; --surface-2:#E9EDED;
    --ink:#101718; --ink-2:#4E5C5E; --line:#D6DCDC;
    --accent:#0B6E5F; --accent-ink:#FFFFFF; --accent-2:#0E8F79;
    --warn:#8A5A12; --warn-bg:#FBF0DC; --crit:#A33F36;
    --shadow:0 1px 2px rgba(16,23,24,.06), 0 8px 24px -16px rgba(16,23,24,.28);
    --display:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --body:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D1314; --surface:#151D1E; --surface-2:#1D2728;
      --ink:#E7EDEC; --ink-2:#96A5A5; --line:#263233;
      --accent:#46C5A8; --accent-ink:#08201C; --accent-2:#6FDCC2;
      --warn:#E5B970; --warn-bg:#2A2213; --crit:#E0685D;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0D1314; --surface:#151D1E; --surface-2:#1D2728;
    --ink:#E7EDEC; --ink-2:#96A5A5; --line:#263233;
    --accent:#46C5A8; --accent-ink:#08201C; --accent-2:#6FDCC2;
    --warn:#E5B970; --warn-bg:#2A2213; --crit:#E0685D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
  :root[data-theme="light"] {
    --ground:#F2F4F4; --surface:#FFFFFF; --surface-2:#E9EDED;
    --ink:#101718; --ink-2:#4E5C5E; --line:#D6DCDC;
    --accent:#0B6E5F; --accent-ink:#FFFFFF; --accent-2:#0E8F79;
    --warn:#8A5A12; --warn-bg:#FBF0DC; --crit:#A33F36;
    --shadow:0 1px 2px rgba(16,23,24,.06), 0 8px 24px -16px rgba(16,23,24,.28);
  }

  body { background:var(--ground); color:var(--ink); font-family:var(--body);
         line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding:40px 20px 72px; }

  header { display:flex; flex-direction:column; gap:10px; margin-bottom:28px; }
  .eyebrow { font-family:var(--data); font-size:11px; letter-spacing:.12em;
             text-transform:uppercase; color:var(--ink-2); }
  h1 { font-family:var(--display); font-weight:600; font-size:clamp(28px,4vw,42px);
       line-height:1.1; text-wrap:balance; letter-spacing:-.01em; }
  .lede { color:var(--ink-2); max-width:66ch; font-size:15px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
           gap:1px; background:var(--line); border:1px solid var(--line);
           border-radius:4px; overflow:hidden; margin:26px 0; }
  .stat { background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:4px; }
  .stat dt { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
  .stat dd { font-family:var(--data); font-size:22px; font-variant-numeric:tabular-nums;
             letter-spacing:-.02em; }
  .stat dd small { display:block; font-size:11.5px; line-height:1.4; color:var(--ink-2);
                   letter-spacing:0; font-family:var(--body); margin-top:3px; }

  /* ---- FILTERS ---- */
  .fbar { display:flex; flex-direction:column; gap:9px; padding:15px 17px; margin-bottom:10px;
          background:var(--surface); border:1px solid var(--line); border-radius:8px;
          box-shadow:var(--shadow); position:sticky; top:0; z-index:5; }
  .frow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .flabel { font-family:var(--data); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--ink-2); width:66px; flex:none; }
  .fchip { font-family:var(--data); font-size:12px; padding:5px 10px; border-radius:999px;
           cursor:pointer; background:var(--surface-2); color:var(--ink-2);
           border:1px solid transparent; }
  .fchip:hover { color:var(--ink); border-color:var(--line); }
  .fchip[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink);
                                border-color:var(--accent); font-weight:600; }
  .fchip .n { opacity:.55; margin-left:5px; font-size:10.5px; }
  .fchip[aria-pressed="true"] .n { opacity:.8; }
  .fbar .tail { display:flex; align-items:center; gap:10px; margin-left:auto;
                font-family:var(--data); font-size:11.5px; color:var(--ink-2); }
  .fclear { font-family:var(--data); font-size:11.5px; cursor:pointer; background:none;
            border:1px solid var(--line); border-radius:999px; padding:5px 11px; color:var(--ink-2); }
  .fclear:hover { color:var(--ink); border-color:var(--ink-2); }
  .fchip:focus-visible, .fclear:focus-visible, a:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }
  .fhint { font-size:12.5px; color:var(--ink-2); margin:0 2px 24px; }
  .fhint b { color:var(--ink); font-weight:600; }
  .fempty { display:none; padding:30px; text-align:center; color:var(--ink-2);
            border:1px dashed var(--line); border-radius:8px; margin-bottom:26px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:6px;
          padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); }
  .card[hidden], .sect[hidden] { display:none !important; }
  .card.fresh { border-color:var(--accent-2); }
  .card.gone { opacity:.6; }
  .card.gone .price .amt { text-decoration:line-through; text-decoration-thickness:1.5px; }
  .card.gone h2 { color:var(--ink-2); }
  .card.gone a.cta { background:transparent; color:var(--ink-2);
                     border:1px dashed var(--line); }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-family:var(--data); font-size:11px; letter-spacing:.04em; padding:3px 7px;
           border-radius:3px; background:var(--surface-2); color:var(--ink-2); }
  .badge.ram { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  .badge.ram.sub { background:transparent; color:var(--ink-2); border:1px solid var(--accent); }
  .badge.shop { background:var(--warn-bg); color:var(--warn); }
  .badge.est { background:transparent; border:1px dashed var(--line); }
  .badge.sold { background:var(--crit); color:var(--surface); font-weight:600; }
  .price { font-family:var(--data); font-size:19px; font-variant-numeric:tabular-nums;
           white-space:nowrap; letter-spacing:-.02em; }
  .price small { display:block; font-size:11px; color:var(--ink-2); letter-spacing:0; }
  .card h2 { font-size:15px; font-weight:600; line-height:1.35; text-wrap:balance; }
  .meta { font-size:13px; color:var(--ink-2); display:flex; gap:10px; flex-wrap:wrap; }
  .stamp { font-family:var(--data); font-size:10.5px; letter-spacing:.03em; color:var(--ink-2); }
  .stamp::before { content:"\25CF "; }
  .st-live::before { color:var(--accent); }
  .st-new::before { color:var(--accent-2); }
  .st-gone::before { color:var(--crit); }
  .evidence { font-family:var(--data); font-size:11.5px; line-height:1.5; color:var(--ink-2);
              background:var(--surface-2); padding:8px 10px; border-radius:4px;
              overflow-x:auto; white-space:nowrap; }
  .note { font-size:12.5px; color:var(--warn); background:var(--warn-bg); padding:8px 10px;
          border-radius:4px; line-height:1.45; }
  .card a.cta { margin-top:auto; display:inline-flex; align-items:center; justify-content:center;
                gap:8px; text-decoration:none; font-size:14px; font-weight:600;
                background:var(--accent); color:var(--accent-ink); padding:10px 14px; border-radius:4px; }
  .card a.cta:hover { filter:brightness(1.08); }

  .actions { margin-top:auto; display:flex; gap:8px; align-items:stretch; }
  .card a.cta { margin-top:0; flex:1 1 auto; }
  .favbtn { flex:none; width:44px; cursor:pointer; font-size:15px; line-height:1;
            background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
            border-radius:4px; }
  .favbtn:hover { color:var(--accent); border-color:var(--accent); }
  .favbtn[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink);
                                 border-color:var(--accent); }
  .favbtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card.fav { border-color:var(--accent); }

  /* ---- PRICE SECTION ----
     Dumbbell (first sweep -> latest median) over a range track (current low-high).
     One hue, two shades; validated against both page surfaces at 2.35:1 / 3.13:1. */
  .viz, .ptip { --v-prev:#6FB6A8; --v-now:var(--accent); --v-track:var(--surface-2);
         --v-grid:var(--line); }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) :is(.viz, .ptip) { --v-prev:#2C7566; }
  }
  :root[data-theme="dark"] :is(.viz, .ptip) { --v-prev:#2C7566; }

  .pgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:26px; }
  .pblock { background:var(--surface); border:1px solid var(--line); border-radius:6px;
            padding:18px 20px 16px; box-shadow:var(--shadow); }
  .pblock h3 { font-size:14px; font-weight:600; margin-bottom:2px; }
  .pblock .psub { font-size:12.5px; color:var(--ink-2); margin-bottom:14px; }

  .plegend { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px;
             font-size:11.5px; color:var(--ink-2); }
  .plegend span { display:inline-flex; align-items:center; gap:6px; }
  .pkey { width:14px; height:2px; background:var(--v-now); border-radius:2px; }
  .pkey.prev { background:var(--v-prev); }
  .pkey.track { height:9px; border-radius:2px; background:var(--v-track); }
  .pkey.dash { height:0; background:none; border-top:2px dashed var(--v-prev); }
  .pkey.hollow { width:9px; height:9px; border-radius:50%; background:var(--surface);
                 box-shadow:inset 0 0 0 2px var(--v-now); }

  /* ---- PRICE OVER TIME ---- */
  /* scrolls sideways on a phone rather than shrinking its text below reading size */
  .tscroll { overflow-x:auto; }
  .tchart { display:block; width:100%; min-width:640px; height:auto; overflow:visible; }
  .tchart .tgrid { stroke:var(--v-grid); stroke-width:1; }
  .tchart text { fill:var(--ink-2); font-family:var(--data); font-size:11px; }
  .tchart .tn { font-size:10px; opacity:.8; }
  .tchart .tband { stroke:var(--v-track); stroke-width:10; stroke-linecap:round; }
  .tchart .tline { stroke:var(--v-now); stroke-width:2.25; fill:none; }
  .tchart .tmodel { stroke:var(--v-prev); stroke-width:2; fill:none; stroke-dasharray:6 5; }
  .tchart .terr { stroke:var(--v-prev); stroke-width:1.5; stroke-dasharray:2 3; }
  .tchart .tdot { fill:var(--v-now); stroke:var(--surface); stroke-width:2; }
  .tchart .test { fill:var(--surface); stroke:var(--v-now); stroke-width:2.25; }
  .tchart .thit { fill:transparent; outline:none; }
  .tchart :not(.thit) { pointer-events:none; }
  .tchart .thit:hover, .tchart .thit:focus-visible { fill:var(--surface-2); fill-opacity:.55; }
  .tchart .thit:focus-visible { stroke:var(--accent); stroke-width:2; }

  .prows { position:relative; }
  .prow { display:grid; grid-template-columns:80px 1fr 62px; align-items:center;
          gap:10px; padding:5px 0; border-radius:4px; }
  .prow:hover, .prow:focus-visible { background:var(--surface-2); outline:none; }
  .prow:focus-visible { box-shadow:inset 0 0 0 2px var(--accent); }
  .plabel { font-family:var(--data); font-size:12px; color:var(--ink);
            display:flex; justify-content:space-between; gap:6px; }
  .plabel .pn { color:var(--ink-2); font-size:10.5px; }
  .ptrack { position:relative; height:22px; }
  .pband { position:absolute; top:7px; height:9px; background:var(--v-track);
           border-radius:2px; }
  .pconn { position:absolute; top:10.5px; height:2px; background:var(--v-prev);
           border-radius:2px; }
  .pdot { position:absolute; top:6.5px; width:9px; height:9px; border-radius:50%;
          margin-left:-4.5px; box-shadow:0 0 0 2px var(--surface); }
  .pdot.prev { background:var(--v-prev); }
  .pdot.now  { background:var(--v-now); }
  .pdelta { font-family:var(--data); font-size:11.5px; color:var(--ink-2);
            text-align:right; font-variant-numeric:tabular-nums; }

  /* the plot column is the 1fr cell: 80px label + 10px gap left, 62px delta + 10px gap right */
  .paxis { position:relative; height:15px; margin:5px 72px 0 90px; }
  .paxis .ptick { position:absolute; top:0; font-family:var(--data); font-size:10px;
                  color:var(--ink-2); transform:translateX(-50%); white-space:nowrap; }
  .pgrid-lines { position:absolute; top:0; bottom:0; left:90px; right:72px;
                 pointer-events:none; }
  .pgrid-lines i { position:absolute; top:0; bottom:0; width:1px; background:var(--v-grid); }

  .ptable { width:100%; border-collapse:collapse; margin-top:16px; font-size:12px;
            font-variant-numeric:tabular-nums; }
  .ptable caption { text-align:left; font-size:11px; letter-spacing:.08em;
                    text-transform:uppercase; color:var(--ink-2); padding-bottom:6px;
                    font-family:var(--data); }
  .ptable th, .ptable td { padding:5px 6px; text-align:right; border-top:1px solid var(--line); }
  .ptable th { font-weight:600; color:var(--ink-2); font-size:10.5px;
               letter-spacing:.04em; text-transform:uppercase; border-top:0; }
  .ptable th:first-child, .ptable td:first-child { text-align:left; font-family:var(--data); }

  /* ---- MIX OVER TIME ----
     Ordinal teal ramp: chip and memory are both ordered, so more-is-darker
     carries the order. 5 steps validated --ordinal on both page surfaces. */
  /* Six steps, not five: memory reached a sixth tier when a 256 GB Studio Ultra
     turned up, and five steps would have painted two adjacent tiers the same.
     Generated at even OKLCH lightness spacing, then validated --ordinal against
     each surface: monotone L, adjacent ΔL ≥ 0.06, hue spread 0.8°, and the step
     nearest the surface at 2.39:1 light / 2.52:1 dark. */
  .viz { --o1:#6CB69A; --o2:#57A086; --o3:#418B71;
         --o4:#2A765D; --o5:#0E624A; --o6:#024D39; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz {
      --o1:#16674F; --o2:#337E65; --o3:#4C967C;
      --o4:#65AF93; --o5:#7EC8AC; --o6:#97E2C5; }
  }
  :root[data-theme="dark"] .viz {
    --o1:#16674F; --o2:#337E65; --o3:#4C967C;
    --o4:#65AF93; --o5:#7EC8AC; --o6:#97E2C5; }

  .mrow { display:grid; grid-template-columns:74px 1fr 34px; align-items:center;
          gap:10px; padding:6px 0; }
  .mlabel { font-family:var(--data); font-size:11.5px; color:var(--ink-2); }
  .mbar { display:flex; height:20px; border-radius:2px; overflow:hidden; }
  .mseg { position:relative; min-width:2px; }
  .mseg + .mseg { margin-left:2px; }            /* 2px surface gap, not a border */
  .mtotal { font-family:var(--data); font-size:11.5px; color:var(--ink-2);
            text-align:right; font-variant-numeric:tabular-nums; }

  .swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* posting-date strip: one row per class, one dot per ad, shared date axis */
  .strip { position:relative; }
  .sgroup { font-family:var(--data); font-size:10.5px; letter-spacing:.12em;
            text-transform:uppercase; color:var(--ink-2); margin:14px 0 4px; }
  .srow { display:grid; grid-template-columns:74px 1fr 34px; align-items:center;
          gap:10px; padding:3px 0; border-radius:4px; }
  .srow:hover, .srow:focus-visible { background:var(--surface-2); outline:none; }
  .srow:focus-visible { box-shadow:inset 0 0 0 2px var(--accent); }
  .strack { position:relative; height:18px; }
  .strack::before { content:""; position:absolute; left:0; right:0; top:8.5px;
                    height:1px; background:var(--line); }
  .sdot { position:absolute; top:5px; width:9px; height:9px; margin-left:-4.5px;
          border-radius:50%; box-shadow:0 0 0 2px var(--surface); }
  .saxis { position:relative; height:15px; margin:6px 44px 0 84px; }
  .saxis span { position:absolute; top:0; font-family:var(--data); font-size:10px;
                color:var(--ink-2); transform:translateX(-50%); white-space:nowrap; }

  .ptip { position:fixed; z-index:20; pointer-events:none; opacity:0;
          background:var(--surface); border:1px solid var(--line); border-radius:5px;
          padding:9px 11px; box-shadow:var(--shadow); font-size:12px; max-width:250px;
          transition:opacity .1s; }
  .ptip[data-on="1"] { opacity:1; }
  .ptip b { font-family:var(--data); font-variant-numeric:tabular-nums; font-size:12.5px; }
  .ptip .trow { display:flex; align-items:center; gap:7px; color:var(--ink-2);
                margin-top:4px; }
  .ptip .thead { font-weight:600; color:var(--ink); }
  .pcaveat { margin-top:22px; font-size:12.5px; color:var(--warn); background:var(--warn-bg);
             padding:11px 13px; border-radius:4px; line-height:1.5; max-width:78ch; }
  .sect { margin-top:46px; padding-top:26px; border-top:1px solid var(--line); }
  .sect h2.sec { font-family:var(--display); font-size:23px; font-weight:600; margin-bottom:8px; }
  .sect p.sec { color:var(--ink-2); font-size:14.5px; max-width:68ch; margin-bottom:20px; }

  /* ---- TABS ---- */
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:0 0 26px; }
  .tab { font-family:var(--display); font-size:19px; font-weight:600; padding:8px 16px 10px;
         background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
         color:var(--ink-2); cursor:pointer; }
  .tab:hover { color:var(--ink); }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .tab .n { font-family:var(--data); font-size:11px; font-weight:400; margin-left:7px; }
  .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [role="tabpanel"] > .sect:first-child { margin-top:0; border-top:0; padding-top:0; }

  /* ---- LANGUAGE ---- */
  .sprite { position:absolute; width:0; height:0; overflow:hidden; }
  .hrow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .lang { position:relative; flex:none; }
  .langbtn { display:inline-flex; align-items:center; gap:7px; cursor:pointer;
             font-family:var(--data); font-size:12px; letter-spacing:.06em; color:var(--ink);
             padding:5px 10px 5px 7px; background:var(--surface); border:1px solid var(--line);
             border-radius:999px; }
  .langbtn:hover { border-color:var(--ink-2); }
  .langbtn:focus-visible, .langmenu button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .flag { width:20px; height:14px; flex:none; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.14); }
  .caret { width:10px; height:6px; fill:none; stroke:var(--ink-2); stroke-width:1.6; }
  .langbtn[aria-expanded="true"] .caret { transform:rotate(180deg); }
  .langmenu { position:absolute; right:0; top:calc(100% + 6px); z-index:30; min-width:170px;
              display:flex; flex-direction:column; gap:2px; padding:5px; background:var(--surface);
              border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); }
  .langmenu[hidden] { display:none; }
  .langmenu button { display:flex; align-items:center; gap:10px; width:100%; padding:7px 9px;
                     border:0; border-radius:5px; background:none; color:var(--ink);
                     font:inherit; font-size:13.5px; text-align:left; cursor:pointer; }
  .langmenu button:hover, .langmenu button:focus-visible { background:var(--surface-2); }
  .langmenu button[aria-checked="true"] { font-weight:600; }
  .langmenu .code { margin-left:auto; font-family:var(--data); font-size:11px; color:var(--ink-2); }

  footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--line);
           font-size:12.5px; color:var(--ink-2); display:flex; flex-direction:column; gap:6px; }
  @media (max-width:820px){ .fbar { position:static; } .flabel { width:auto; } }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="flag-en" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice">
    <clipPath id="flag-en-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
    <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#flag-en-t)" stroke="#C8102E" stroke-width="4"/>
    <path d="M30,0 v30 M0,15 h60" stroke="#FFFFFF" stroke-width="10"/>

const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ESC[c]);

// ---------- language ----------
// Every word the page prints comes from STRINGS. Listing titles, descriptions and
// curated notes are the sellers' and this project's own text and are shown as written.
const LANGS = { en: { name: "English", locale: "en-GB" }, ro: { name: "Română", locale: "ro-RO" } };
const LANG_KEY = "olmacs-lang";
// pinned = chosen, by the link or by the reader; only then is it written into the
// URL, so a link copied by someone who never touched the switcher stays clean
let langPinned = true;
let lang = (() => {
  const m = location.hash.match(/(?:^#|&)lang=(en|ro)(?:&|$)/);
  if (m) return m[1];
  try { const v = localStorage.getItem(LANG_KEY); if (LANGS[v]) return v; } catch (e) {}
  langPinned = false;
  return /^ro\b/i.test(navigator.language || "") ? "ro" : "en";
})();

// "1 ad", "3 ads". Romanian puts "de" between a number and its noun from 20 up,
// and again after each hundred: "20 de anunțuri", "100 de", but "101 anunțuri".
const qty = (n, one, many) =>
  n === 1 ? "1 " + one
  : lang === "ro" && n && (n % 100 === 0 || n % 100 >= 20) ? n + " de " + many
  : n + " " + many;

// Sweep dates are stored as the sweeper prints them ("1 Oct 2026") and shown in
// the reader's language.
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dateAs(s, opts) {
  const [d, m, y] = String(s).split(" "), mo = MONTHS.indexOf(m);
  if (mo < 0) return s;
  return new Date(Date.UTC(+y, mo, +d))
    .toLocaleDateString(LANGS[lang].locale, Object.assign({ timeZone: "UTC" }, opts));
}
const dateLong = s => dateAs(s, { day: "numeric", month: "short", year: "numeric" });
const dateShort = s => dateAs(s, { day: "numeric", month: "short" });

const state = { kind:new Set(), gen:new Set(), ram:new Set(), storage:new Set(), city:new Set(), facet_status:new Set() };

// file:// origins often refuse localStorage, so the hash is the durable copy.
const FAV_KEY = "olx-macs-shortlist";
const favs = (() => {
  const set = new Set();
  try { (JSON.parse(localStorage.getItem(FAV_KEY)) || []).forEach(v => set.add(v)); } catch (e) {}
  const m = location.hash.match(/fav=([^&]*)/);
  if (m) decodeURIComponent(m[1]).split(",").filter(Boolean).forEach(v => set.add(v));
  return set;
})();
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) {}
  writeHash();
}
// The hash carries the shortlist, the open tab and a chosen language, so a copied
// link reopens the same view.
function writeHash() {
  const parts = [];
  if (favs.size) parts.push("fav=" + encodeURIComponent([...favs].join(",")));
  if (tab === "statistici") parts.push("tab=statistici");
  if (langPinned) parts.push("lang=" + lang);
  try {
    history.replaceState(null, "", location.pathname + location.search +
                                    (parts.length ? "#" + parts.join("&") : ""));
  } catch (e) {}
}

const chipLabel = (facet, k) => facet === "storage" ? sizeLabel(+k)

function buildRow(facet, counts, order) {
  const row = document.querySelector(`.frow[data-facet="${facet}"]`);
  const keys = order || Object.keys(counts).sort((a,b) => counts[b]-counts[a] || String(a).localeCompare(b));
  const html = keys.map(k =>
    `<button class="fchip" type="button" data-v="${esc(k)}" aria-pressed="false">` +
    `<span class="lbl">${esc(chipLabel(facet, k))}</span>` +
    `<span class="n">${counts[k] || 0}</span></button>`).join("");
  row.querySelector(".flabel").insertAdjacentHTML("afterend", html);
  row.querySelectorAll(".fchip").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.v, on = state[facet].has(v);
    on ? state[facet].delete(v) : state[facet].add(v);
    b.setAttribute("aria-pressed", String(!on));
    render();
  }));
}

// ---------- price structure ----------
// Two sweeps only, so "evolution" is two medians and the gap between them, never a curve.
const SWEEPS = DATA.sweeps;
const NOW_OFFER = ALL.filter(i => i.status !== "gone");
// The comparison is always first sweep vs latest, so it widens as sweeps
// accumulate. Every label below is derived from these — nothing about a date is
// written into the page, or a sweep would turn the copy into a lie.
const FIRST_SWEEP = SWEEPS[0], LAST_SWEEP = SWEEPS[SWEEPS.length - 1];
// set by paintText, in the reader's language
let D_FIRST, D_LAST;
const PREV_OFFER = FIRST_SWEEP.offer;
const PLOT_FACETS = ["kind","gen","ram","storage","city"];   // Status/shortlist do not scope this section
const AXIS_MAX = Math.ceil(
  Math.max(...NOW_OFFER.concat(PREV_OFFER).map(i => i.ron)) / 5000) * 5000;
const TICKS = [];
for (let t = 0; t <= AXIS_MAX; t += 10000) TICKS.push(t);

const pos = v => (v / AXIS_MAX) * 100;
const median = xs => {
  const s = [...xs].sort((a,b) => a-b), h = s.length >> 1;
  return Math.round(s.length % 2 ? s[h] : (s[h-1] + s[h]) / 2);
};
const statMatch = i => PLOT_FACETS.every(f =>
  !state[f].size || String(i[f]).split(",").some(v => state[f].has(v)));

function groupBy(items, dim) {
  const g = new Map();
  for (const i of items) {
    const k = String(i[dim]);
    (g.get(k) || g.set(k, []).get(k)).push(i);
  }
  return g;
}

const tip = document.getElementById("ptip");
function showTip(ev, row) {
  showTipLines(ev, row.label + " · " + tr("machines", row.n), [
    ["", tr("tipLowHigh"), fmt(row.lo) + " – " + fmt(row.hi) + " lei"],
    ["now", tr("medianOn", D_LAST) + " (n " + row.n + ")", fmt(row.med) + " lei"],
    ["prev", tr("medianOn", D_FIRST) + " (n " + row.pn + ")",
     row.pmed == null ? "—" : fmt(row.pmed) + " lei"],
    ["", tr("change"), row.deltaText],
  ]);
}
// lines are [key class, name, value]; the key draws the matching legend mark
function showTipLines(ev, headText, lines) {
  tip.innerHTML = "";
  const head = document.createElement("div");
  head.className = "thead";
  head.textContent = headText;
  tip.appendChild(head);
  for (const [key, name, val] of lines) {
    const r = document.createElement("div");
    r.className = "trow";
    if (key) { const k = document.createElement("i"); k.className = "pkey " + key; r.appendChild(k); }
    r.appendChild(document.createTextNode(name + " "));
    const b = document.createElement("b");
    b.textContent = val;
    r.appendChild(b);
    tip.appendChild(r);
  }
  tip.dataset.on = "1";
  const box = tip.getBoundingClientRect();
  const r = (ev.currentTarget || ev.target).getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - box.width - 10,
                            Math.max(10, r.left + 20)) + "px";
  tip.style.top = Math.max(10, r.top - box.height - 8 < 10
                            ? r.bottom + 8 : r.top - box.height - 8) + "px";
}
const hideTip = () => { tip.dataset.on = "0"; };

function priceRows(dim, order) {
  const now = groupBy(NOW_OFFER.filter(statMatch), dim);
  const prev = groupBy(PREV_OFFER.filter(statMatch), dim);
  const keys = [...new Set([...now.keys(), ...prev.keys()])].sort(order);
  return keys.filter(k => now.has(k)).map(k => {
    const cur = now.get(k).map(i => i.ron), old = (prev.get(k) || []).map(i => i.ron);
    const med = median(cur), pmed = old.length ? median(old) : null;
    const pct = pmed ? (med - pmed) / pmed * 100 : null;
    return {
      key: k,
      label: dim === "ram" ? k + " GB" : k,
      n: cur.length, pn: old.length,
      lo: Math.min(...cur), hi: Math.max(...cur), med, pmed,
      perGB: median(now.get(k).map(i => i.ron / i.ram)),
      delta: pct,
      deltaText: pct == null ? tr("noFigure", D_FIRST)
        : (pct >= 0 ? "▲ +" : "▼ −") + Math.abs(pct).toFixed(0) + "%"
          + " (" + (med >= pmed ? "+" : "−") + fmt(Math.abs(med - pmed)) + " lei)",
    };
  });
}

function paintBlock(id, dim, order, dimLabel) {
  const root = document.getElementById(id);
  const rows = priceRows(dim, order);
  const rowsEl = root.querySelector(".prows");
  rowsEl.innerHTML = "";

  const lines = document.createElement("div");
  lines.className = "pgrid-lines";
  TICKS.forEach(t => {
    const i = document.createElement("i");
    i.style.left = pos(t) + "%";
    lines.appendChild(i);
  });
  rowsEl.appendChild(lines);

  for (const r of rows) {
    const el = document.createElement("div");
    el.className = "prow";
    el.tabIndex = 0;
    el.innerHTML =
      `<div class="plabel"><span></span><span class="pn">n ${r.n}</span></div>` +
      `<div class="ptrack">` +
        `<div class="pband" style="left:${pos(r.lo)}%;width:${Math.max(pos(r.hi-r.lo), 0.6)}%"></div>` +
        (r.pmed == null ? "" :
          `<div class="pconn" style="left:${pos(Math.min(r.med,r.pmed))}%;` +
          `width:${pos(Math.abs(r.med-r.pmed))}%"></div>` +
          `<div class="pdot prev" style="left:${pos(r.pmed)}%"></div>`) +
        `<div class="pdot now" style="left:${pos(r.med)}%"></div>` +
      `</div><div class="pdelta"></div>`;
    el.querySelector(".plabel span").textContent = r.label;
    el.querySelector(".pdelta").textContent =
      r.delta == null ? "—"
        : (r.delta >= 0 ? "▲ " : "▼ ") + Math.abs(r.delta).toFixed(0) + "%";
    el.setAttribute("aria-label", tr("pRowAria", r));
    ["pointerenter","focus"].forEach(e => el.addEventListener(e, ev => showTip(ev, r)));
    ["pointerleave","blur"].forEach(e => el.addEventListener(e, hideTip));
    rowsEl.appendChild(el);
  }

  const ax = root.querySelector(".paxis");
  ax.innerHTML = "";
  TICKS.forEach(t => {
    const s = document.createElement("span");
    s.className = "ptick";
    s.style.left = pos(t) + "%";
    s.textContent = t ? (t / 1000) + "k" : "0";
    ax.appendChild(s);
  });

  // table twin - every plotted value readable without hovering
  const tbl = root.querySelector(".ptable");
  const head = [tr("thLow"), tr("thMedian"), tr("thHigh"), "lei / GB", D_FIRST + " (n)", "Δ"];
  let html = `<caption>${tr("sameLei")}</caption><tr><th>${dimLabel}</th><th>n</th>` +
             head.map(h => `<th>${h}</th>`).join("") + "</tr>";
  for (const r of rows) {
    html += `<tr><td>${esc(r.label)}</td><td>${r.n}</td><td>${fmt(r.lo)}</td>` +
            `<td>${fmt(r.med)}</td><td>${fmt(r.hi)}</td><td>${fmt(Math.round(r.perGB))}</td>` +
            `<td>${r.pmed == null ? "—" : fmt(r.pmed) + " (" + r.pn + ")"}</td>` +
            `<td>${r.delta == null ? "—"
                  : (r.delta >= 0 ? "+" : "−") + Math.abs(r.delta).toFixed(0) + "%"}</td></tr>`;
  }
  tbl.innerHTML = rows.length ? html
    : `<caption>${tr("sameLei")}</caption><tr><td>${tr("empty")}</td></tr>`;
}

// ---------- mix over time ----------
// Classes are ordered (M3<M4<M5, 24<...<128), so the ordinal ramp carries the order
// and the same step means the same tier in every chart in this section.
const RAMP = ["var(--o1)","var(--o2)","var(--o3)","var(--o4)","var(--o5)","var(--o6)"];
const MIX_WINDOW = 14;   // sweep rows drawn; older ones stay in the data
const rampFor = (keys, k) => RAMP[keys.length <= 1 ? 0
  : Math.round(keys.indexOf(k) * (RAMP.length - 1) / (keys.length - 1))];

const classesOf = (dim, order) =>
  [...new Set(SWEEPS.flatMap(s => s.offer.filter(statMatch).map(i => String(i[dim]))))].sort(order);
const labelOf = (dim, k) => dim === "ram" ? k + " GB" : k;

function paintLegend(el, dim, keys) {
  el.innerHTML = "";
  for (const k of keys) {
    const s = document.createElement("span");
    const sw = document.createElement("i");
    sw.className = "swatch";
    sw.style.background = rampFor(keys, k);
    s.appendChild(sw);
    s.appendChild(document.createTextNode(labelOf(dim, k)));
    el.appendChild(s);
  }
}

function paintMix(id, dim, order, dimLabel) {
  const root = document.getElementById(id);
  const keys = classesOf(dim, order);
  paintLegend(root.querySelector(".plegend"), dim, keys);

  // At a daily cadence this would grow a row a day and stop being readable, so
  // only the most recent window is drawn. What was dropped is stated, never
  // silently truncated — and the table twin still lists the same window.
  const hidden = Math.max(0, SWEEPS.length - MIX_WINDOW);
  const counts = SWEEPS.slice(-MIX_WINDOW).map(s => {
    const kept = s.offer.filter(statMatch);
    const c = {};
    keys.forEach(k => c[k] = kept.filter(i => String(i[dim]) === k).length);
    return { date: s.date, c, total: kept.length };
  });
  const widest = Math.max(1, ...counts.map(r => r.total));
  root.querySelector(".psub").textContent = tr("mixSub", dimLabel.toLowerCase(), hidden);

  const rows = root.querySelector(".mrows");
  rows.innerHTML = "";
  for (const r of counts) {
    const el = document.createElement("div");
    el.className = "mrow";
    const lab = document.createElement("div");
    lab.className = "mlabel";
    lab.textContent = dateShort(r.date);
    const bar = document.createElement("div");
    bar.className = "mbar";
    // the row's own width tracks its share of the widest sweep, so a shrinking
    // market reads as a shorter bar rather than a re-normalised one
    bar.style.width = (r.total / widest * 100) + "%";
    for (const k of keys) {
      if (!r.c[k]) continue;
      const seg = document.createElement("div");
      seg.className = "mseg";
      seg.style.background = rampFor(keys, k);
      seg.style.flex = r.c[k];
      // no number inside the segment: two ramp steps cannot hold 10.5px text at
      // 4.5:1, and the table twin below carries every count anyway
      seg.title = labelOf(dim, k) + ": " + r.c[k];
      bar.appendChild(seg);
    }
    const tot = document.createElement("div");
    tot.className = "mtotal";
    tot.textContent = r.total;
    el.append(lab, bar, tot);
    el.setAttribute("aria-label", tr("mixAria", dateLong(r.date), r.total,
      keys.filter(k => r.c[k]).map(k => r.c[k] + " × " + labelOf(dim, k)).join(", ")));
    rows.appendChild(el);
  }

  const tbl = root.querySelector(".ptable");
  let html = `<caption>${tr("onOffer")}</caption><tr><th>${tr("thSweep")}</th>` +
    keys.map(k => `<th>${esc(labelOf(dim, k))}</th>`).join("") + `<th>${tr("thAll")}</th></tr>`;
  for (const r of counts)
    html += `<tr><td>${esc(dateLong(r.date))}</td>` +
            keys.map(k => `<td>${r.c[k] || "—"}</td>`).join("") +
            `<td>${r.total}</td></tr>`;
  tbl.innerHTML = counts.length && keys.length ? html
    : `<caption>${tr("onOffer")}</caption><tr><td>${tr("empty")}</td></tr>`;
}

// ---------- posting-date strip ----------
const DAY = 864e5;

// The date OLX reports is the ad SLOT's, not the machine's, and sellers reuse
// slots. A slot opened before the chip inside the machine was on sale cannot be
// when this machine was posted, so its date is not a fact about this market and
// the strip leaves it out.
//
// The floors are the day Apple first sold a Mac with that generation, which is
// the earliest the ad could honestly be: M3 Macs 30 Oct 2023, M4 Macs 30 Oct
// 2024, M5 Macs Oct 2025 (dated to the 1st, since only the month is certain
// here). A generation floor, not a variant one — the base chip always lands
// first, so this excludes only what is certainly impossible and never guesses a
// Pro or Max ship date.
//
// One blanket cutoff of 2023-01-01 used to do this job and was too loose:
// IDikeuZ, an M4 Pro, sits in a slot opened 27 May 2024 — five months before any
// M4 Mac was on sale — and would have plotted there, dragging the oldest ad and
// the median age of both M4 and 48 GB with it.
const GEN_FLOOR = { M3: "2023-10-30", M4: "2024-10-28", M5: "2025-10-01" };
const slotPredatesChip = i =>
  !i.created || i.created < (GEN_FLOOR[i.gen] || "2023-01-01");
const AGED = ALL.filter(i => i.status !== "gone" && !slotPredatesChip(i));
const t0 = Math.min(...AGED.map(i => Date.parse(i.created)));
const t1 = Date.parse(DATA.sweeps[DATA.sweeps.length - 1].iso);
const tpos = iso => (Date.parse(iso) - t0) / (t1 - t0) * 100;

function paintAge() {
  const root = document.getElementById("mblock-age");
  const kept = AGED.filter(statMatch);
  const strip = root.querySelector(".strip");
  strip.innerHTML = "";

  const groups = [
    [tr("fChip"), "gen", classesOf("gen", strAsc)],
    [tr("fMemory"), "ram", classesOf("ram", numAsc)],
  ];
  const tableRows = [];

  for (const [gname, dim, keys] of groups) {
    const h = document.createElement("div");
    h.className = "sgroup";
    h.textContent = gname;
    strip.appendChild(h);
    for (const k of keys) {
      const mine = kept.filter(i => String(i[dim]) === k)
                       .sort((a,b) => a.created.localeCompare(b.created));
      const el = document.createElement("div");
      el.className = "srow";
      el.tabIndex = 0;
      const lab = document.createElement("div");
      lab.className = "mlabel";
      lab.textContent = labelOf(dim, k);
      const track = document.createElement("div");
      track.className = "strack";
      for (const i of mine) {
        const dot = document.createElement("div");
        dot.className = "sdot";
        dot.style.left = tpos(i.created) + "%";
        dot.style.background = rampFor(keys, k);
        dot.title = i.created + " · " + i.title;
        track.appendChild(dot);
      }
      const n = document.createElement("div");
      n.className = "mtotal";
      n.textContent = mine.length || "—";
      el.append(lab, track, n);

      const oldest = mine[0], newest = mine[mine.length - 1];
      const ageOf = x => Math.round((t1 - Date.parse(x.created)) / DAY);
      el.setAttribute("aria-label", mine.length
        ? tr("ageAria", labelOf(dim, k), mine.length, oldest.created, newest.created)
        : tr("ageNone", labelOf(dim, k)));
      strip.appendChild(el);
      tableRows.push([gname, labelOf(dim, k), mine.length,
                      oldest ? oldest.created : "—", newest ? newest.created : "—",
                      mine.length ? tr("days", ageOf(mine[Math.floor(mine.length/2)])) : "—"]);
    }
  }

  const ax = root.querySelector(".saxis");
  ax.innerHTML = "";
  const d0 = new Date(t0), marks = [];
  for (let y = d0.getFullYear(), mo = d0.getMonth(); ; mo++) {
    const dt = new Date(Date.UTC(y, mo, 1));
    if (dt.getTime() > t1) break;
    if (dt.getTime() >= t0) marks.push(dt);
  }
  const every = Math.ceil(marks.length / 7);
  marks.forEach((dt, ix) => {
    if (ix % every) return;
    const s = document.createElement("span");
    s.style.left = tpos(dt.toISOString().slice(0,10)) + "%";
    s.textContent = dt.toLocaleDateString(LANGS[lang].locale, { month:"short", year:"2-digit", timeZone:"UTC" });
    ax.appendChild(s);
  });

  const tbl = root.querySelector(".ptable");
  tbl.innerHTML = `<caption>${tr("ageCap")}</caption>` +
    "<tr>" + tr("ageHead").map(h => `<th>${h}</th>`).join("") + "</tr>" +
    tableRows.map(r => "<tr>" + r.map((v,ix) =>
      `<td>${esc(v)}</td>`).join("") + "</tr>").join("");

  // Both exclusion reasons are counted, never asserted: a sweep changes them.
  const onOffer = ALL.filter(i => i.status !== "gone");
  const noDate = onOffer.filter(i => !i.created).length;
  const staleSlot = onOffer.filter(i => i.created && slotPredatesChip(i)).length;
  document.getElementById("agesub").textContent =
    tr("ageSub", kept.length, onOffer.length, noDate, staleSlot);
}

function renderMix() {
  paintMix("mblock-gen", "gen", strAsc, tr("fChip"));
  paintMix("mblock-ram", "ram", numAsc, tr("fMemory"));
  paintAge();

// ---------- price over time ----------
// One hedonic model for the whole market: log asking price against the sweep,
// machine type, chip generation, memory and storage. It is what lets a sweep with
// nothing matching the filters still carry a figure — and that figure is drawn
// hollow and called an estimate everywhere it appears.
//
// Fitted once, on every ad at every sweep, never on the filtered subset: a
// selection of three ads cannot support a model, and the point is to borrow from
// what is on offer around the selection — a 36 and a 64 GB machine say something
// about the 48 GB one between them. Memory and storage enter as log2, so each
// doubling carries one fitted premium. Chip variant (Pro, Max) is left out because
// the filters cannot select it; each ad's own premium below carries it instead.
const OBS = SWEEPS.flatMap((s, t) => s.offer.map(o => Object.assign({ t }, o)));
const levelsOf = dim => [...new Set(OBS.map(o => o[dim]))].sort();
const M_KIND = levelsOf("kind"), M_GEN = levelsOf("gen");
const features = (c, t) => [
  ...SWEEPS.map((_, k) => k === t ? 1 : 0),       // one level per sweep, no global intercept
  ...M_KIND.slice(1).map(k => c.kind === k ? 1 : 0),
  ...M_GEN.slice(1).map(g => c.gen === g ? 1 : 0),
  Math.log2(c.ram),
  c.storage ? Math.log2(c.storage / 512) : 0,
  c.storage ? 0 : 1,                              // storage not stated
];
const MODEL = (() => {
  const X = OBS.map(o => features(o, o.t)), y = OBS.map(o => Math.log(o.ron));
  const p = X[0].length;
  // normal equations, solved by Gauss-Jordan with partial pivoting
  const A = Array.from({ length: p }, () => new Array(p + 1).fill(0));
  X.forEach((r, n) => {
    for (let i = 0; i < p; i++) {
      for (let j = 0; j < p; j++) A[i][j] += r[i] * r[j];
      A[i][p] += r[i] * y[n];
    }
  });
  for (let i = 0; i < p; i++) A[i][i] += 1e-6;    // numerical safety only
  for (let c = 0; c < p; c++) {
    let piv = c;
    for (let r = c + 1; r < p; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    [A[c], A[piv]] = [A[piv], A[c]];
    for (let r = 0; r < p; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k <= p; k++) A[r][k] -= f * A[c][k];
    }
  }
  const w = A.map((r, i) => r[p] / r[i]);
  const fit = (c, t) => features(c, t).reduce((s, v, i) => s + v * w[i], 0);
  const res = OBS.map((o, n) => y[n] - fit(o, o.t));
  const sse = res.reduce((s, r) => s + r * r, 0);
  const mean = y.reduce((s, v) => s + v, 0) / y.length;
  const sst = y.reduce((s, v) => s + (v - mean) ** 2, 0);
  // Each ad's own premium or discount against the model — Pro or Max, condition,
  // warranty — averaged over every sweep it was seen at.
  const own = new Map();
  OBS.forEach((o, n) => (own.get(o.oid) || own.set(o.oid, []).get(o.oid)).push(res[n]));
  for (const [k, v] of own) own.set(k, v.reduce((s, x) => s + x, 0) / v.length);
  return { fit, own, sd: Math.sqrt(sse / Math.max(1, y.length - p)), r2: 1 - sse / sst };
})();

const MODEL_DIMS = ["kind", "gen", "ram", "storage"];
const facetText = (f, v) => f === "ram" ? v + " GB" : f === "storage" ? (+v ? sizeLabel(+v) : tr("unstated")) : v;

// What the estimate prices. Ads that matched the filters at any sweep are carried
// to every other sweep with their own premium intact, so the line follows those
// machines rather than a market average. When nothing matching was ever on offer,
// the configuration itself is priced. A dimension the filters leave open takes its
// most common value among the ads closest to the selection, and the pool narrows
// as each dimension is settled — so an open-type M4 gets a MacBook's storage, not
// a mini's. A narrowing that would leave nobody is skipped.
function trendBasis() {
  const seen = new Map();
  for (const o of OBS) if (statMatch(o) && !seen.has(o.oid)) seen.set(o.oid, o);
  if (seen.size)
    return { items: [...seen.values()].map(o => ({ c: o, own: MODEL.own.get(o.oid) })), filled: null };
  let pool = [...new Map(OBS.map(o => [o.oid, o])).values()];
  const narrow = (dim, vals) => {
    const kept = pool.filter(o => vals.includes(String(o[dim])));
    if (kept.length) pool = kept;
  };
  for (const dim of MODEL_DIMS) if (state[dim].size) narrow(dim, [...state[dim]]);
  const mode = dim => {
    const c = new Map();
    pool.forEach(o => { if (o[dim]) c.set(o[dim], (c.get(o[dim]) || 0) + 1); });
    return [...c].sort((a, b) => b[1] - a[1])[0]?.[0] ?? 0;
  };
  const filled = [];
  let configs = [{}];
  for (const dim of MODEL_DIMS) {
    let vals = [...state[dim]];
    if (!vals.length) {
      vals = [String(mode(dim))];
      filled.push([dim, vals[0]]);
      narrow(dim, vals);
    }
    const typed = vals.map(v => dim === "ram" || dim === "storage" ? Number(v) : v);
    configs = configs.flatMap(c => typed.map(v => Object.assign({}, c, { [dim]: v })));
  }
  return { items: configs.map(c => ({ c, own: 0 })), filled };
}

const TW = 1100, TH = 330, TM = { l: 58, r: 24, t: 14, b: 50 };
const tx0 = Date.parse(FIRST_SWEEP.iso), tx1 = Date.parse(LAST_SWEEP.iso);
const TX = iso => TM.l + (tx1 > tx0 ? (Date.parse(iso) - tx0) / (tx1 - tx0) : .5) * (TW - TM.l - TM.r);
const niceStep = span => {
  const raw = span / 5, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
};
const f1 = v => v.toFixed(1);

function paintTrend() {
  const basis = trendBasis();
  const spread = Math.exp(MODEL.sd);
  const rows = SWEEPS.map((s, t) => {
    const xs = s.offer.filter(statMatch).map(o => o.ron);
    return {
      s, t, n: xs.length,
      lo: xs.length ? Math.min(...xs) : null, hi: xs.length ? Math.max(...xs) : null,
      med: xs.length ? median(xs) : null,
      est: median(basis.items.map(b => Math.exp(MODEL.fit(b.c, t) + b.own))),
    };
  });

  const sel = PLOT_FACETS.filter(f => state[f].size)
    .map(f => [...state[f]].map(v => facetText(f, v)).join(tr("or")));
  document.getElementById("ttitle").textContent = sel.length ? sel.join(" · ") : tr("everything");
  document.getElementById("tmodelKey").textContent = tr(basis.filled ? "keyModelConfig" : "keyModelSame");
  document.getElementById("tfit").textContent = tr("tfit", OBS.length, MODEL.own.size, SWEEPS.length,
    Math.round(MODEL.r2 * 100), Math.round((spread - 1) * 100));

  // the axis fits the selection: a 6 000 lei mini and a 30 000 lei Studio on one
  // fixed scale would flatten whichever is selected into a line
  const ys = rows.flatMap(r => r.n ? [r.lo, r.hi, r.est] : [r.est / spread, r.est * spread]);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < y1 * 0.1) { y0 -= y1 * 0.05; y1 += y1 * 0.05; }
  const step = niceStep(y1 - y0);
  y0 = Math.max(0, Math.floor(y0 / step) * step);
  y1 = Math.ceil(y1 / step) * step;
  const TY = v => TM.t + (1 - (v - y0) / (y1 - y0)) * (TH - TM.t - TM.b);
  const xs = rows.map(r => TX(r.s.iso));

  let svg = "";
  // hit columns first, so the marks drawn over them never swallow the pointer
  rows.forEach((r, t) => {
    const a = t ? (xs[t-1] + xs[t]) / 2 : TM.l - 12;
    const b = t < rows.length - 1 ? (xs[t] + xs[t+1]) / 2 : TW - TM.r + 12;
    const label = r.n ? tr("hitAria", dateLong(r.s.date), r.n, fmt(r.med), fmt(r.est))
                      : tr("hitAriaNone", dateLong(r.s.date), fmt(r.est));
    svg += `<rect class="thit" tabindex="0" data-t="${t}" x="${f1(a)}" y="${TM.t}" ` +
           `width="${f1(Math.max(b - a, 1))}" height="${TH - TM.t - TM.b}" aria-label="${esc(label)}"/>`;
  });
  for (let k = 0; y0 + k * step <= y1 + 1e-6; k++) {
    const v = y0 + k * step, y = f1(TY(v));
    svg += `<line class="tgrid" x1="${TM.l}" x2="${TW - TM.r}" y1="${y}" y2="${y}"/>` +
           `<text x="${TM.l - 8}" y="${f1(TY(v) + 4)}" text-anchor="end">${v ? +(v / 1000).toFixed(1) + "k" : "0"}</text>`;
  }
  // date labels thinned from the latest backwards, so the newest sweep is always named
  let lastX = Infinity;
  for (let t = rows.length - 1; t >= 0; t--) {
    if (lastX - xs[t] < 62) continue;
    lastX = xs[t];
    svg += `<text x="${f1(xs[t])}" y="${TH - TM.b + 20}" text-anchor="middle">${esc(dateShort(rows[t].s.date))}</text>` +
           `<text class="tn" x="${f1(xs[t])}" y="${TH - TM.b + 36}" text-anchor="middle">n ${rows[t].n}</text>`;
  }
  rows.forEach((r, t) => {
    const x = f1(xs[t]);
    if (r.n && r.hi > r.lo)
      svg += `<line class="tband" x1="${x}" x2="${x}" y1="${f1(TY(r.lo))}" y2="${f1(TY(r.hi))}"/>`;
    if (!r.n)
      svg += `<line class="terr" x1="${x}" x2="${x}" y1="${f1(TY(r.est / spread))}" y2="${f1(TY(r.est * spread))}"/>`;
  });
  svg += `<polyline class="tmodel" points="${rows.map((r, t) => f1(xs[t]) + "," + f1(TY(r.est))).join(" ")}"/>`;
  // the observed line only joins sweeps that both had something on offer; across a
  // gap the dashed model line is the only thing drawn, so nothing is implied
  for (let t = 1; t < rows.length; t++)
    if (rows[t].n && rows[t-1].n)
      svg += `<line class="tline" x1="${f1(xs[t-1])}" y1="${f1(TY(rows[t-1].med))}" ` +
             `x2="${f1(xs[t])}" y2="${f1(TY(rows[t].med))}"/>`;
  rows.forEach((r, t) => {
    svg += `<circle class="${r.n ? "tdot" : "test"}" cx="${f1(xs[t])}" cy="${f1(TY(r.n ? r.med : r.est))}" r="5"/>`;
  });

  const chart = document.getElementById("tchart");
  chart.innerHTML = svg;
  const from = basis.filled ? tr("fromConfig") : tr("fromAds", basis.items.length);
  chart.querySelectorAll(".thit").forEach(el => {
    const r = rows[+el.dataset.t];
    const head = dateLong(r.s.date) + " · " + (r.n ? tr("machines", r.n) : tr("nothingOnOffer"));
    const lines = r.n ? [
      ["", tr("lowHigh"), fmt(r.lo) + " – " + fmt(r.hi) + " lei"],
      ["now", tr("median"), fmt(r.med) + " lei"],
      ["dash", tr("model"), fmt(r.est) + " lei"],
    ] : [
      ["hollow", tr("estimate"), fmt(r.est) + " lei"],
      ["", tr("typicalErr"), fmt(Math.round(r.est / spread)) + " – " + fmt(Math.round(r.est * spread)) + " lei"],
      ["", tr("from"), from],
    ];
    ["pointerenter", "focus"].forEach(e => el.addEventListener(e, ev => showTipLines(ev, head, lines)));
    ["pointerleave", "blur"].forEach(e => el.addEventListener(e, hideTip));
  });

  document.querySelector("#tblock .ptable").innerHTML =
    `<caption>${tr("sameLei")}</caption><tr><th>${tr("thSweep")}</th><th>n</th><th>${tr("thLow")}</th>` +
    `<th>${tr("thMedian")}</th><th>${tr("thHigh")}</th><th>${tr("model")}</th></tr>` +
    rows.map(r => `<tr><td>${esc(dateLong(r.s.date))}</td><td>${r.n}</td><td>${fmt(r.lo)}</td>` +
      `<td>${fmt(r.med)}</td><td>${fmt(r.hi)}</td>` +
      `<td>${fmt(r.est)}${r.n ? "" : " (" + tr("estimateLower") + ")"}</td></tr>`).join("");

  // derived, like every other caveat on the page
  document.getElementById("tcaveat").textContent = tr("tcaveat",
    rows.filter(r => !r.n).length, SWEEPS.length, basis.filled, state.city.size > 0);
}

// ---------- tabs ----------
const TABS = [...document.querySelectorAll('[role="tab"]')];
function showTab(name) {
  tab = name;
  TABS.forEach(b => {
    const on = b.dataset.tab === name;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  document.getElementById("panel-oferte").hidden = name !== "oferte";
  document.getElementById("panel-statistici").hidden = name !== "statistici";
  document.getElementById("sortCtl").hidden = name !== "oferte";   // sorting is for the cards
  hideTip();
}
TABS.forEach((b, ix) => {
  b.addEventListener("click", () => { showTab(b.dataset.tab); writeHash(); });
  // arrow keys move between tabs, as the ARIA tabs pattern expects
  b.addEventListener("keydown", ev => {
    const move = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
    if (!move) return;
    const next = TABS[(ix + move + TABS.length) % TABS.length];
    showTab(next.dataset.tab);
    writeHash();
    next.focus();
    ev.preventDefault();
  });
});
showTab(tab);

// ---------- derived prose ----------
// Every sentence here is counted from the data, opening words included, and re-run
// when the language changes. It used to read "Two sweeps so far:" in the markup
// with only the dates filled in, so the third sweep turned it into "Two sweeps so
// far: 4 between 28 Jul and 14 Aug" — a hand-written count going stale in exactly
// the way the rest of this page is built to prevent.
function paintText() {
  D_FIRST = dateShort(FIRST_SWEEP.date);
  D_LAST = dateShort(LAST_SWEEP.date);
  const first = dateLong(FIRST_SWEEP.date), last = dateLong(LAST_SWEEP.date);

  // naming the source matters: BNR and ECB differ in the fourth decimal, and the
  // sweeper falls back to ECB when bnr.ro refuses the connection
  document.getElementById("frate").innerHTML =
    tr("rate", esc((S.eur_ron_source ? S.eur_ron_source + " " : "") + S.eur_ron));
  document.getElementById("stamp").textContent = tr("stamp", dateLong(S.built), dateLong(S.checked));

  // Available only, like the price range beside it. S.by_ram and S.by_gen span
  // every listing ever seen, gone ones included, which reads as a range you could
  // go and buy: on 14 Aug the 256 GB Studio Ultra was retired and the header would
  // still have offered "24-256 GB".
  const live = ALL.filter(l => l.status !== "gone");
  const rams = [...new Set(live.map(l => l.ram))].sort((a,b) => a-b);
  const tally = live.reduce((acc,l) => (acc[l.gen] = (acc[l.gen] || 0) + 1, acc), {});
  const gens = Object.entries(tally).sort().map(([k,v]) => v + " \u00d7 " + k).join(" \u00b7 ");
  document.getElementById("stats").innerHTML = [
    [tr("sForSale"), fmt(S.available), tr("sAdded", S.fresh, dateLong(S.prev))],
    [tr("sGone"), fmt(S.sold), tr("sGoneSub")],
    [tr("sRange"), fmt(S.min) + "\u2013" + fmt(S.max), tr("sRangeSub")],
    [tr("sMemory"), rams.length ? rams[0] + "\u2013" + rams[rams.length-1] + " GB" : "\u2014", gens],
    [tr("sCities"), fmt(S.cities), Object.entries(S.by_city).sort((a,b)=>b[1]-a[1])
      .slice(0,3).map(([c,n]) => esc(c) + " " + n).join(" \u00b7 ")]
  ].map(([h,v,sub]) => `<div class="stat"><dt>${h}</dt><dd>${v}<small>${sub}</small></dd></div>`).join("");

  document.getElementById("psec").textContent = tr("psec", SWEEPS.length, first, last);
  document.getElementById("msec").textContent = tr("msec", SWEEPS.length, first, last);
  document.getElementById("mcaveat").textContent = tr("mcaveat", SWEEPS.length);
  const selfRepriced = ALL.filter(i => i.price_was && i.status !== "gone").length;
  document.getElementById("pcaveat").textContent = tr("pcaveat", S.sold_since, S.fresh, selfRepriced);
}

// ---------- language switcher ----------
const langBtn = document.getElementById("langBtn"), langMenu = document.getElementById("langMenu");
const langItems = [...langMenu.querySelectorAll("[data-lang]")];
function openLangMenu() {
  langMenu.hidden = false;
  langBtn.setAttribute("aria-expanded", "true");
  (langItems.find(b => b.dataset.lang === lang) || langItems[0]).focus();
}
function closeLangMenu(refocus) {
  if (langMenu.hidden) return;
  langMenu.hidden = true;
  langBtn.setAttribute("aria-expanded", "false");
  if (refocus) langBtn.focus();
}
langBtn.addEventListener("click", () => langMenu.hidden ? openLangMenu() : closeLangMenu(false));
langBtn.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { openLangMenu(); ev.preventDefault(); }
});
langItems.forEach((b, ix) => {
  b.addEventListener("click", () => { closeLangMenu(true); setLang(b.dataset.lang); });
  b.addEventListener("keydown", ev => {
    const move = { ArrowDown: 1, ArrowUp: -1 }[ev.key];
    if (move) {
      langItems[(ix + move + langItems.length) % langItems.length].focus();
      ev.preventDefault();
    } else if (ev.key === "Escape") {
      closeLangMenu(true);
      ev.preventDefault();
    } else if (ev.key === "Tab") {
      closeLangMenu(false);
    }
  });
});
document.addEventListener("click", ev => { if (!ev.target.closest(".lang")) closeLangMenu(false); });

function localize() {
  applyStatic();
  relabelChips();
  paintText();
  langBtn.querySelector("use").setAttribute("href", "#flag-" + lang);
  document.getElementById("langCode").textContent = lang.toUpperCase();
  langBtn.setAttribute("aria-label", tr("language") + ": " + LANGS[lang].name);
  langMenu.setAttribute("aria-label", tr("language"));
  langItems.forEach(b => b.setAttribute("aria-checked", String(b.dataset.lang === lang)));
}
function setLang(l) {
  lang = l;
  langPinned = true;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  writeHash();
  localize();
  render();
}

function render() {
  const cmp = (a,b) => sortBy === "ram" ? (b.ram-a.ram) || (a.ron-b.ron) : (a.ron-b.ron);
  const m = DATA.main.filter(matches).sort(cmp);
  const n = DATA.minis.filter(matches).sort(cmp);
  document.getElementById("grid").innerHTML = m.map(cardHTML).join("");
  document.getElementById("miniGrid").innerHTML = n.map(cardHTML).join("");
  document.getElementById("miniSect").hidden = n.length === 0;

  // the shortlist ignores the filters - it is the saved list, not a view of it.
  // Hidden while the shortlist filter is on, since the grids already show exactly that.
  const saved = ALL.filter(i => favs.has(i.oid)).sort(cmp);
  document.getElementById("favGrid").innerHTML = saved.map(cardHTML).join("");
  document.getElementById("favSect").hidden = favOnly || saved.length === 0;
  document.getElementById("favN").textContent = saved.length;
  document.getElementById("favFilter").disabled = saved.length === 0;
  renderPrice();
  renderMix();
  paintTrend();
  const shown = m.length + n.length;
  document.getElementById("fcount").textContent =
    shown === ALL.length ? tr("machines", ALL.length) : tr("fcountOf", shown, ALL.length);
  document.getElementById("fempty").style.display = shown ? "none" : "block";
  document.getElementById("tabN").textContent = shown;
}
localize();
render();
</script>
